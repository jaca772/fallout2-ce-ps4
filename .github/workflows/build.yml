# PS4 overlay build — on demand ONLY (workflow_dispatch; deliberately no schedule —
# fallout2-ce is experimental and commits daily, so builds are always manual).
# Publish-safe / secret-free: the default (console) mode bundles no Sony modules, so
# CI needs no proprietary files. It clones fallout2-ce, applies overlay + patches,
# builds the pkg with the OpenOrbis toolchain (seeded once — see
# scripts/seed-toolchain.md), and (by default) publishes it as a GitHub Release.
name: build-ps4

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "fallout2-ce ref (blank = pinned in scripts/config.sh; 'main' = latest CE)"
        required: false
        default: ""
      publish_release:
        description: "Publish the pkg as a GitHub Release (uncheck for a test build — artifact only)"
        type: boolean
        required: false
        default: true
      native_videoout:
        description: "Also build the experimental native-sceVideoOut pkg (no Sony modules; FALL20003)"
        type: boolean
        required: false
        default: true

# gh release create/download need write access to the repo's Releases.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The 1.6 GB OpenOrbis toolchain lives in Actions cache, NOT in the repo.
      - name: Restore OpenOrbis toolchain (cache)
        id: toolchain
        uses: actions/cache@v4
        with:
          path: /opt/pacbrew
          key: openorbis-toolchain-v1

      # First run / cache miss: fetch the toolchain you seeded once as a release
      # asset (see scripts/seed-toolchain.md). gh handles private-repo auth via
      # GITHUB_TOKEN, so there is no URL/asset-id to configure — just the tag.
      - name: Fetch OpenOrbis toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOOLCHAIN_TAG: ${{ vars.TOOLCHAIN_TAG || 'toolchain-v1' }}
        run: |
          set -euxo pipefail
          gh release download "$TOOLCHAIN_TAG" -R "$GITHUB_REPOSITORY" \
             -p 'openorbis-toolchain.tar.gz' -O /tmp/toolchain.tar.gz
          sudo mkdir -p /opt/pacbrew
          sudo tar -xzf /tmp/toolchain.tar.gz -C /opt/pacbrew

      - name: Build pkg(s)
        run: |
          set -euxo pipefail
          source /opt/pacbrew/ps4/openorbis/ps4vars.sh
          if [ -n "${{ github.event.inputs.upstream_ref }}" ]; then
            export UPSTREAM_REF='${{ github.event.inputs.upstream_ref }}'
          fi

          # 1) Console (default) pkg: SDL/Piglet renderer; the user supplies the two
          #    Sony GLES modules on the console.
          bash scripts/build.sh

          # 2) Native sceVideoOut pkg (experimental): renders via native sceVideoOut,
          #    needs NO Sony modules and no console-side file copying. Distinct title
          #    id (FALL20003) so it installs alongside the console build.
          if [ "${{ inputs.native_videoout }}" = "true" ]; then
            PS4_EXTRA_CMAKE=-DPS4_NATIVE_VIDEOOUT=ON bash scripts/build.sh
          fi

          ls -la *.pkg

      - name: Upload pkg(s)
        uses: actions/upload-artifact@v4
        with:
          name: fallout2-ce-ps4-pkg
          path: |
            *.pkg
            build-manifest.txt
          if-no-files-found: error

      # Publish the pkg as a GitHub Release (one per manual run; the newest is
      # always on top). Traceable: the tag/title carry the exact CE commit built.
      # Skipped when publish_release is unchecked (test build -> artifact only).
      - name: Publish Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          commit=$(sed -n 's/^upstream_commit=//p' build-manifest.txt)
          date=$(sed -n 's/^upstream_date=//p' build-manifest.txt)
          short=${commit:0:12}
          ref='${{ github.event.inputs.upstream_ref }}'
          [ -n "$ref" ] || ref='pinned (scripts/config.sh)'
          tag="build-${{ github.run_number }}"

          # Idempotent on re-runs: drop a same-tag release/tag if one exists.
          gh release delete "$tag" --cleanup-tag --yes || true

          notes=$(cat <<EOF
          PS4 pkg(s) built from **fallout2-ce @ \`$short\`** ($date).
          Requested ref: \`$ref\`.

          **Console build** — \`IV0001-FALL20002_00-FALL200020100000.pkg\` (SDL/Piglet
          renderer). On the console you supply the game data **and** the two GLES
          modules (\`libScePigletv2VSH.sprx\`, \`libSceShaccVSH.sprx\`); this pkg bundles
          no Sony modules.

          **Native sceVideoOut build (experimental)** — \`IV0001-FALL20003_00-FALL200030100000.pkg\`
          ("Fallout II CE (native videoout)"). Renders via native sceVideoOut, so it needs
          **no Sony modules at all** — only the game data. Installs alongside the console
          build. Included when the \`native_videoout\` input is checked.

          See the README for the full setup.
          EOF
          )

          gh release create "$tag" \
            --title "PS4 pkg — CE @ $short (build #${{ github.run_number }})" \
            --notes "$notes" \
            *.pkg build-manifest.txt
