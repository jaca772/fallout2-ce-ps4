# PS4 overlay build -- on demand ONLY (workflow_dispatch; deliberately no schedule --
# fallout2-ce is experimental and commits daily, so builds are always manual).
# Publish-safe / secret-free: renders via native sceVideoOut, bundles no Sony modules,
# and requires no proprietary files. It clones fallout2-ce, applies overlay + patches,
# builds the pkg with the OpenOrbis toolchain (seeded once -- see
# scripts/seed-toolchain.md), and (by default) publishes it as a GitHub Release.
name: build-ps4

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "CE ref to build. LEAVE BLANK = tested/pinned CE commit (scripts/config.sh UPSTREAM_REF). 'main' = newest CE main (EXPERIMENTAL). Or any SHA / tag / branch."
        required: false
        default: ""
      release_notes:
        description: "Optional custom notes shown at the TOP of the release body (auto-changelog stays below). Single line; use \\n for line breaks."
        required: false
        default: ""
      publish_release:
        description: "Publish the pkg as a GitHub Release (uncheck for a test build -- artifact only)"
        type: boolean
        required: false
        default: true

# gh release create/download need write access to the repo's Releases.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The input description is static text, so surface the resolved CE ref here
      # (and again in the release body) -- especially for "LEAVE BLANK = pinned".
      - name: Resolve upstream ref
        env:
          UPSTREAM_REF_INPUT: ${{ github.event.inputs.upstream_ref }}
        run: |
          set -euo pipefail
          if [ -n "$UPSTREAM_REF_INPUT" ]; then
            requested="$UPSTREAM_REF_INPUT"
            resolved="$UPSTREAM_REF_INPUT"
          else
            . scripts/config.sh
            requested='(empty) pinned'
            resolved="$UPSTREAM_REF"
          fi
          {
            echo "- Requested ref: \`$requested\`"
            echo "- Resolved CE ref: \`$resolved\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # The 1.6 GB OpenOrbis toolchain lives in Actions cache, NOT in the repo.
      - name: Restore OpenOrbis toolchain (cache)
        id: toolchain
        uses: actions/cache@v4
        with:
          path: /opt/pacbrew
          key: openorbis-toolchain-v1

      # First run / cache miss: fetch the toolchain you seeded once as a release
      # asset (see scripts/seed-toolchain.md). gh handles private-repo auth via
      # GITHUB_TOKEN, so there is no URL/asset-id to configure -- just the tag.
      - name: Fetch OpenOrbis toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOOLCHAIN_TAG: ${{ vars.TOOLCHAIN_TAG || 'toolchain-v1' }}
        run: |
          set -euxo pipefail
          gh release download "$TOOLCHAIN_TAG" -R "$GITHUB_REPOSITORY" \
             -p 'openorbis-toolchain.tar.gz' -O /tmp/toolchain.tar.gz
          sudo mkdir -p /opt/pacbrew
          sudo tar -xzf /tmp/toolchain.tar.gz -C /opt/pacbrew

      - name: Build pkg
        run: |
          set -euxo pipefail
          source /opt/pacbrew/ps4/openorbis/ps4vars.sh
          REF='${{ github.event.inputs.upstream_ref }}'
          if [ -n "$REF" ]; then
            if ! [[ "$REF" =~ ^[a-zA-Z0-9_./-]+$ ]]; then
              echo "Error: Invalid upstream_ref format: $REF"
              exit 1
            fi
            export UPSTREAM_REF="$REF"
          fi

          bash scripts/build.sh
          ls -la *.pkg

      - name: Upload pkg
        uses: actions/upload-artifact@v4
        with:
          name: fallout2-ce-ps4-pkg
          path: |
            *.pkg
            build-manifest.txt
          if-no-files-found: error

      # Publish the pkg as a GitHub Release (one per manual run; the newest is
      # always on top). Traceable: the tag/title carry the exact CE commit built.
      # Skipped when publish_release is unchecked (test build -> artifact only).
      - name: Publish Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_REF_INPUT: ${{ github.event.inputs.upstream_ref }}
          RELEASE_NOTES_INPUT: ${{ github.event.inputs.release_notes }}
        run: |
          set -euxo pipefail
          commit=$(sed -n 's/^upstream_commit=//p' build-manifest.txt)
          date=$(sed -n 's/^upstream_date=//p' build-manifest.txt)
          short=${commit:0:12}
          subject=$(git -C tree log -1 --pretty=%s "$commit" 2>/dev/null || true)
          ref="$UPSTREAM_REF_INPUT"
          [ -n "$ref" ] || ref='pinned (scripts/config.sh)'
          tag="build-${{ github.run_number }}"

          # Idempotent on re-runs: drop a same-tag release/tag if one exists. Do it
          # BEFORE finding the previous build tag so a re-run never sees itself.
          gh release delete "$tag" --cleanup-tag --yes || true

          # Previous pkg build (ignore non-build releases such as the seeded toolchain).
          prev_tag=$(gh release list --limit 100 --json tagName \
            --jq '[.[].tagName | select(startswith("build-"))][0] // empty' 2>/dev/null || true)

          prev_ce=""
          if [ -n "$prev_tag" ] && gh release download "$prev_tag" -p build-manifest.txt -O prev-manifest.txt >/dev/null 2>&1; then
            prev_ce=$(sed -n 's/^upstream_commit=//p' prev-manifest.txt)
          fi
          ce_changes=""
          if [ -n "$prev_ce" ] && [ "$prev_ce" != "$commit" ]; then
            ce_changes="**CE changes:** https://github.com/fallout2-ce/fallout2-ce/compare/${prev_ce}...${commit}"$'\n\n'
          fi

          custom="$RELEASE_NOTES_INPUT"
          custom=$(printf '%b' "$custom")
          [ -z "$custom" ] || custom="$custom"$'\n\n'

          notes=$(cat <<EOF
          ${custom}${ce_changes}**PS4 pkg** built from **fallout2-ce @ \`$short\`** ($date).
          CE commit: \`$commit\`
          Subject: $subject
          Requested ref: \`$ref\`

          **Package** -- \`IV0001-FALL20002_00-FALL200020100000.pkg\` ("Fallout II Community Edition").
          Renders via native \`sceVideoOut\` flip queues (zero proprietary Sony modules needed).
          On the console you only need to supply your game data at \`/data/fallout2/\`.

          See the README for the full setup.
          EOF
          )

          extra=()
          [ -z "$prev_tag" ] || extra+=(--notes-start-tag "$prev_tag")

          gh release create "$tag" \
            --title "PS4 pkg -- CE @ $short (build #${{ github.run_number }})" \
            --notes "$notes" \
            --generate-notes \
            "${extra[@]}" \
            *.pkg build-manifest.txt